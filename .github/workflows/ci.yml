name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1

# Everything below runs in parallel. The browser tests only wait for the build, not for the
# quick static checks, so a slow lint never delays them. The last job, "CI passed", is the one
# to require in branch protection: it is green only when every other job is.
jobs:
  typecheck:
    name: Types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npx next typegen
      - run: npx tsc --noEmit

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run lint

  unit:
    name: Unit and content tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # Same tests as `npm test`, plus line coverage written to the run's summary page. It has no
      # threshold yet; e2e scripts are not counted.
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v6
        with:
          name: unit-coverage
          path: coverage/summary.md
          retention-days: 1

  coverage-comment:
    name: Coverage comment
    needs: unit
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: unit-coverage
          path: coverage
      - uses: actions/github-script@v9
        with:
          script: |
            const fs = require('node:fs');
            const marker = '<!-- gradelings-coverage-summary -->';
            const summary = fs.readFileSync('coverage/summary.md', 'utf8').trim();
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker),
            );
            const body = `${marker}\n${summary}\n\n_Updated by [CI run #${context.runNumber}](${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId})._`;

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # Next's incremental build cache, so unchanged files aren't compiled again.
      - uses: actions/cache@v6
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'next.config.ts') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      # The Piper voices (about 130 MB from our piper-voices release), so each run doesn't download them again.
      - uses: actions/cache@v6
        with:
          path: public/piper
          key: piper-${{ hashFiles('src/lib/piper-manifest.json', 'package-lock.json') }}
      - run: npm run build
      # One tar file keeps the folder layout exactly as built. The Piper files go too, for the offline test.
      - run: tar -cf next-build.tar --exclude=.next/cache .next public/piper
      - uses: actions/upload-artifact@v6
        with:
          name: next-build
          path: next-build.tar
          compression-level: 1
          retention-days: 1

  # Device layouts run in the Playwright image: WebKit's system libraries take longer to install
  # on each run than the image takes to pull. The image tag must match the Playwright version in
  # package-lock.json, so bump both together.
  devices:
    name: Browser · ${{ matrix.name }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        include:
          # 14 device layouts, split over four machines. iPhones and iPads run in real WebKit.
          - { name: "devices 1/4", shard: "1/4" }
          - { name: "devices 2/4", shard: "2/4" }
          - { name: "devices 3/4", shard: "3/4" }
          - { name: "devices 4/4", shard: "4/4" }
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          flavor: playwright
      - uses: actions/download-artifact@v7
        with:
          name: next-build
      - run: tar -xf next-build.tar
      - name: Run
        run: scripts/ci-with-server.sh node scripts/e2e-devices.mjs http://localhost:3000 e2e-shots/devices --shard ${{ matrix.shard }}
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: screenshots-devices-${{ strategy.job-index }}
          path: e2e-shots
          retention-days: 7

  # The Chromium-only checks run on the plain runner, where installing Chromium is quicker than
  # pulling the Playwright image.
  browser:
    name: Browser · ${{ matrix.name }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "accessibility", serve: true, run: "node scripts/e2e-a11y.mjs http://localhost:3000 e2e-shots/a11y" }
          # The playthrough is split in three so no part is the slowest job.
          - { name: "playthrough modes", serve: true, run: "node scripts/e2e.mjs http://localhost:3000 e2e-shots --part modes" }
          - { name: "parent area and arcade", serve: true, run: "node scripts/e2e.mjs http://localhost:3000 e2e-shots --part parents" }
          - { name: "sync and offline", serve: true, run: "node scripts/e2e.mjs http://localhost:3000 e2e-shots --part sync --offline" }
          - { name: "classroom", serve: true, run: "node scripts/e2e-classroom.mjs http://localhost:3000 e2e-shots/classroom" }
          - { name: "placement", serve: true, run: "node scripts/e2e-placement.mjs http://localhost:3000 e2e-shots/placement" }
          # Starts and stops its own server, so only the service worker can answer.
          - { name: "offline", serve: false, run: "node scripts/e2e-offline.mjs" }
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v7
        with:
          name: next-build
      - run: tar -xf next-build.tar
      - uses: ./.github/actions/browsers
        with:
          browsers: chromium
      - name: Run
        run: |
          if [ "${{ matrix.serve }}" = "true" ]; then
            scripts/ci-with-server.sh ${{ matrix.run }}
          else
            ${{ matrix.run }}
          fi
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: screenshots-${{ strategy.job-index }}
          path: e2e-shots
          retention-days: 7

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # Reads the lockfile only, so there is no install and it finishes in seconds.
      # Production dependencies are what ship to families, so they gate the build.
      - run: npm audit --omit=dev --audit-level=high
      # Dev tooling is reported for visibility but does not block a merge.
      - run: npm audit --audit-level=high
        continue-on-error: true

  passed:
    name: CI passed
    needs: [typecheck, lint, unit, audit, build, devices, browser]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded
        run: |
          echo '${{ toJSON(needs) }}'
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then
            exit 1
          fi
