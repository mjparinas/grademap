name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1

# Everything below runs in parallel. The browser tests only wait for the build, not for the
# quick static checks, so a slow lint never delays them. The last job, "CI passed", is the one
# to require in branch protection: it is green only when every other job is.
jobs:
  typecheck:
    name: Types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npx next typegen
      - run: npx tsc --noEmit

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run lint

  unit:
    name: Unit and content tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # Same tests as `npm test`, plus line coverage written to the run's summary page. It has no
      # threshold yet; e2e scripts are not counted.
      - run: npm run test:coverage

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # Next's incremental build cache, so unchanged files aren't compiled again.
      - uses: actions/cache@v6
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'next.config.ts') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npm run build
      # One tar file keeps the folder layout exactly as built.
      - run: tar -cf next-build.tar --exclude=.next/cache .next
      - uses: actions/upload-artifact@v6
        with:
          name: next-build
          path: next-build.tar
          compression-level: 1
          retention-days: 1

  browser:
    name: Browser · ${{ matrix.name }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Browsers and their system libraries come preinstalled. The tag must match the Playwright
    # version in package-lock.json, so bump both together.
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        include:
          # 14 device layouts, split over four machines. iPhones and iPads run in real WebKit.
          - { name: "devices 1/4", serve: true, run: "node scripts/e2e-devices.mjs http://localhost:3000 e2e-shots/devices --shard 1/4" }
          - { name: "devices 2/4", serve: true, run: "node scripts/e2e-devices.mjs http://localhost:3000 e2e-shots/devices --shard 2/4" }
          - { name: "devices 3/4", serve: true, run: "node scripts/e2e-devices.mjs http://localhost:3000 e2e-shots/devices --shard 3/4" }
          - { name: "devices 4/4", serve: true, run: "node scripts/e2e-devices.mjs http://localhost:3000 e2e-shots/devices --shard 4/4" }
          - { name: "accessibility", serve: true, run: "node scripts/e2e-a11y.mjs http://localhost:3000" }
          - { name: "playthrough and sync", serve: true, run: "node scripts/e2e.mjs http://localhost:3000 e2e-shots --offline" }
          # Starts and stops its own server, so only the service worker can answer.
          - { name: "offline", serve: false, run: "node scripts/e2e-offline.mjs" }
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          flavor: playwright
      - uses: actions/download-artifact@v4
        with:
          name: next-build
      - run: tar -xf next-build.tar
      - name: Run
        run: |
          if [ "${{ matrix.serve }}" = "true" ]; then
            scripts/ci-with-server.sh ${{ matrix.run }}
          else
            ${{ matrix.run }}
          fi
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: screenshots-${{ strategy.job-index }}
          path: e2e-shots
          retention-days: 7

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # Reads the lockfile only, so there is no install and it finishes in seconds.
      # Production dependencies are what ship to families, so they gate the build.
      - run: npm audit --omit=dev --audit-level=high
      # Dev tooling is reported for visibility but does not block a merge.
      - run: npm audit --audit-level=high
        continue-on-error: true

  passed:
    name: CI passed
    needs: [typecheck, lint, unit, audit, build, browser]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded
        run: |
          echo '${{ toJSON(needs) }}'
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then
            exit 1
          fi
