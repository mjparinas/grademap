version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Minor and patch updates arrive as one PR a week. Majors stay separate so they get a proper look.
      minor-and-patch:
        update-types: [minor, patch]
    # Playwright is bumped by hand: the browser container image tag in ci.yml must change
    # together with the npm version, and Dependabot can't edit both.
    ignore:
      - dependency-name: playwright
      - dependency-name: "@playwright/*"
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        update-types: [minor, patch]
