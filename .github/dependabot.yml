version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Minor and patch updates arrive as one PR a week. Majors stay separate so they get a proper look.
      minor-and-patch:
        update-types: [minor, patch]
        exclude-patterns: [playwright, "@playwright/*"]
      # The browsers Playwright downloads must match its version, so it moves on its own.
      playwright:
        patterns: [playwright, "@playwright/*", "@axe-core/playwright"]
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        update-types: [minor, patch]
